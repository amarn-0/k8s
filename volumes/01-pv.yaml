apiVersion: v1
kind: PersistentVolume
metadata:
  name: roboshop-ebs
spec:
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 5Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-09088ba7afd180156


--- 

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roboshop-ebs-claim
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: roboshop-ebs
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi

apiVersion: v1
kind: Pod
metadata:
  name: pv-claim
  labels:
    project: roboshop
    component: PV-PVClaim
spec:
  containers:
  - name: nginx
    image: nginx
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b
    volumeMount:
    - name: roboshop-ebs-claim
      path: /var/log/nginx

  volumes:
  - name: roboshop-ebs-claim
    persistentVolumeClaim:
      claimName: roboshop-ebs-claim

apiVersion: v1
kind: Service
metadata:
  name: static-ebs 
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: PV-PVClaim
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
      nodePort: 30007 

