apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
data:
  MONGO: "true"
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"


###

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    teir: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: user
      teir: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: user
        teir: backend
    spec:
      containers:
      - name: user
        image: amar1348/user:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: user
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15


## service

apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    teir: backend
spec:
  selector:
    project: roboshop
    component: user
    teir: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080