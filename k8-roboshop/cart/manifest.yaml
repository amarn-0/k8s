apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: 8080

## deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: cart
    teir: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: cart
      teir: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: cart
        teir: backend
    spec:
      containers:
      - name: cart
        image: amar1384/cart:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: cart
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15

## Service

apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: backend
    teir: backend
spec: 
  selector:
    project: roboshop
    component: backend
    teir: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

