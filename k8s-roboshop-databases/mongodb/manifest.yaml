apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: mongodb
    teir: db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
spec:
  ClusterIP: None
  selector:
    project: roboshop
    component: mongodb
    teir: db
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

apiVersion:
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  replicas: 2 # replicas by default it is 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      teir: db
  serviceName: "mongodb-headless" # this should be head less service name
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        teir: db
    spec:
      containers:
        - name: mongodb
          image: amar1348/mongodb:v1
          volumeMount:
          - name: mongodb
            path: /data/db

  # This is PVC
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi



