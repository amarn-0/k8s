apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  labels:
    project: roboshop
    purpose: Statefulset-demo
spec:
  ClusterIP: None
  selector:
    project: roboshop
    purpose: Statefulset-demo
  ports:
    - name : web
      port: 80

apiVersion: v1
kind: Service
metadata:
  name: statefulset-demo
  labels:
    project: roboshop
    purpose: Statefulset-demo
spec:
  selector:
    project: roboshop
    purpose: Statefulset-demo
  ports:
    - name : web
      port: 80


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx
  labels:
    project: roboshop
    purpose: Statefulset-demo
spec:
  selector:
    matchLabels:
      project: roboshop
      purpose: Statefulset-demo
  serviceName: "nginx-headless"
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        project: roboshop
        purpose: Statefulset-demo # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi